[package]
name = "tensor-adapter"
description = "The DL/tensor adapter: valid-op generation, burn backend implementations, and output normalization."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The dependency arrow points this way and never the other way: the adapter knows
# about the engine, the engine knows nothing about tensors. That is enforced by cargo,
# not by discipline — a `use tensor_adapter::...` inside the engine would not compile.
diff-fuzzer-core = { path = "../diff-fuzzer-core" }
# Version and feature selection live in the root Cargo.toml's [workspace.dependencies].
burn.workspace = true
# For the RNG traits only. The generator itself is always the engine's `SeededRng`,
# never one of this crate's own — a second source of randomness would break replay.
rand.workspace = true
# A finding must serialise whole, so the case type carries serde derives.
serde.workspace = true
# Non-diverging cases are written and read as data (`negatives.rs`) so a later trigger
# claim can be scored against them. Already a workspace dependency, so nothing new is
# pinned.
serde_json.workspace = true
# Only needed to decode fuzzer bytes into cases. Optional, so an ordinary build of this
# library does not pull in a fuzzing dependency it will never use.
arbitrary = { version = "1.4.2", optional = true }

[features]
# Enables `arbitrary::Arbitrary for TensorOp` — see `src/decode.rs`.
fuzzing = ["dep:arbitrary"]

[dev-dependencies]
# Only the examples need to *listen* to log events — a library emits them and lets the
# calling program decide what to do with them. A dev-dependency is not compiled into
# anything this crate publishes.
tracing-subscriber.workspace = true

# Declared explicitly so cargo skips it unless the feature is on. Without this, a
# default-feature build of all targets fails on an example that references a
# feature-gated module.
[[example]]
name = "write_seed_corpus"
required-features = ["fuzzing"]

# Decodes a campaign's corpus, so it needs the same `Arbitrary` impl the fuzzer uses.
[[example]]
name = "corpus_shapes"
required-features = ["fuzzing"]
