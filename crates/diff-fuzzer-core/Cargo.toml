[package]
name = "diff-fuzzer-core"
description = "Target-agnostic engine for differential testing: traits, driver, oracles, minimization, reporting."
# `.workspace = true` inherits the value from [workspace.package] in the root Cargo.toml.
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Versions live in the root Cargo.toml's [workspace.dependencies].
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
rand_chacha.workspace = true
thiserror.workspace = true
tracing.workspace = true
