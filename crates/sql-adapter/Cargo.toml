[package]
name = "sql-adapter"
description = "The SQL adapter: valid query generation, SQLite/DuckDB implementations, and result-set normalization."
# These four are inherited from [workspace.package] in the root Cargo.toml rather than
# repeated here. One version number for the whole project means a saved finding names a
# version that actually identifies the code that produced it.
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The two engines under comparison. Versions and features are pinned once, in the root
# [workspace.dependencies]; `.workspace = true` just says "use that".
#
# They are peers here, not reference-and-candidate: SQLite is the mature engine and a
# disagreement is far likelier to be DuckDB's, but nothing in the code declares either
# one correct. The oracle only ever reports *that* they differ.
rusqlite.workspace = true
duckdb.workspace = true

# Note what is NOT here: `tensor-adapter`. The triage and predicate machinery this domain
# reuses lives in that crate, and it will be *copied* rather than depended on — depending
# on it would drag libtorch and wgpu into every SQL build.
