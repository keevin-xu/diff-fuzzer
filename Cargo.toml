[workspace]
# The engine plus one crate per kind of software under test. `fuzz/` is deliberately NOT
# a member — cargo-fuzz crates are built separately with nightly (PHASE-6, step 6.1).
#
# `sql-adapter` is the second domain (SQLite vs DuckDB). It sits beside `tensor-adapter`
# rather than inside it: the two share the engine and nothing else, and neither may
# depend on the other — a SQL build must never compile libtorch, and a tensor build must
# never compile DuckDB.
members = [
    "crates/diff-fuzzer-core",
    "crates/tensor-adapter",
    "crates/sql-adapter",
]

# Resolver 3 is the current dependency resolver (required for edition 2024).
# A virtual workspace (one with no [package] of its own) must state it explicitly.
resolver = "3"

# Fields shared by every crate in the workspace, so they are declared once here and
# inherited with `edition.workspace = true` in each crate's Cargo.toml. When we add
# dependencies (step 0.6) a [workspace.dependencies] table will go here too, so that
# `burn`'s version is pinned in exactly one place.
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kevinxu/diff-fuzzer"

# Dependency versions are pinned HERE, once, and referenced by members as
# `burn.workspace = true`. A divergence report is only meaningful if it names the
# exact version that produced it, so both crates must never drift apart.
#
# Pinned to 0.21.0 (max stable). 0.22.0-pre.1 exists but is a pre-release whose API
# can shift between builds, which would break reproducibility of saved findings.
[workspace.dependencies]
# `default-features = false` drops burn's training stack (train/dataset/vision/rl).
# We only ever build and compare individual tensor ops, so none of that is needed.
# Backends are opt-in features, and both sides of the differential are enabled here:
#   "flex"    — pure-Rust CPU kernels (replaced "ndarray" at PHASE-7A)
#   "tch"     — libtorch (PyTorch's C++ library) via the `tch` bindings
#   "wgpu"    — GPU, via Metal on this machine
# burn-tch enables tch's `download-libtorch` feature, so the libtorch binaries are
# fetched by the build script; no manual install and no LIBTORCH/DYLD_LIBRARY_PATH.
#
# `wgpu` is the first backend on genuinely different hardware. The two CPU backends run
# the same instruction set, which is why exact agreement has been a defensible default;
# a GPU shares none of that, so what counts as a legal difference has to be re-derived
# rather than assumed (PHASE-7 step 7.4).
burn = { version = "0.21.0", default-features = false, features = [
    "std",
    # `flex` replaced `ndarray` at PHASE-7A: burn's README no longer lists `ndarray` among
    # its first-party CPU backends, and a bug found in a backend the maintainers have moved
    # off is a bug nobody will fix.
    "flex",
    "tch",
    "wgpu",
] }

# Engine dependencies.
# `rand` supplies the RNG traits; `rand_chacha` supplies ChaCha8Rng specifically,
# whose output is guaranteed stable across releases — unlike rand's own StdRng,
# which is explicitly allowed to change algorithm. A saved seed has to mean the
# same thing forever, so the guarantee is the point.
rand = "0.10.2"
rand_chacha = "0.10.0"
# Derives the boilerplate (Display, Error) for error enums.
thiserror = "2.0.19"
# Structured logging. The engine only *emits* events; whether anything listens is the
# calling program's business, which is why the library takes the facade and not a
# subscriber. Every event carries the seed, so a log line is always actionable.
tracing = "0.1.44"
# Serialising findings to disk. A divergence that exists only in a terminal scrollback
# is not a finding anyone can act on. Both crates are already in the dependency graph
# via burn, so this costs no extra compilation.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tracing-subscriber = "0.3.23"

# ---------------------------------------------------------------------------------
# SQL domain (crates/sql-adapter). Used by that crate only; the tensor adapter never
# sees them, and `cargo build -p tensor-adapter` does not compile either engine.
# ---------------------------------------------------------------------------------
#
# Both use `bundled`, meaning the engine's own C/C++ source is compiled from the crate
# rather than linked against whatever the machine happens to have installed. That costs
# build time once and buys the thing this project cannot do without: a finding names an
# engine version, and that version has to be a property of the code, not of the laptop.
# A system SQLite would make the same commit produce different results on two machines.
#
# The consequence to remember at PHASE-S6: both engines are native code compiled by
# build scripts, which cargo-fuzz does not instrument (it sets RUSTFLAGS, not CFLAGS).
# Whether coverage-guided fuzzing sees anything but our own decoder is measured there,
# not assumed here (`planning/sql-duckdb/PENDING.md` 1.7).
rusqlite = { version = "0.40.1", features = ["bundled"] }
duckdb = { version = "1.10505.0", features = ["bundled"] }
