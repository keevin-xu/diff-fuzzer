[workspace]
# The two crates that make up this project. `fuzz/` is deliberately NOT a member —
# cargo-fuzz crates are built separately with nightly (PHASE-6, step 6.1).
members = ["crates/diff-fuzzer-core", "crates/tensor-adapter"]

# Resolver 3 is the current dependency resolver (required for edition 2024).
# A virtual workspace (one with no [package] of its own) must state it explicitly.
resolver = "3"

# Fields shared by every crate in the workspace, so they are declared once here and
# inherited with `edition.workspace = true` in each crate's Cargo.toml. When we add
# dependencies (step 0.6) a [workspace.dependencies] table will go here too, so that
# `burn`'s version is pinned in exactly one place.
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kevinxu/diff-fuzzer"

# Dependency versions are pinned HERE, once, and referenced by members as
# `burn.workspace = true`. A divergence report is only meaningful if it names the
# exact version that produced it, so both crates must never drift apart.
#
# Pinned to 0.21.0 (max stable). 0.22.0-pre.1 exists but is a pre-release whose API
# can shift between builds, which would break reproducibility of saved findings.
[workspace.dependencies]
# `default-features = false` drops burn's training stack (train/dataset/vision/rl).
# We only ever build and compare individual tensor ops, so none of that is needed.
# Backends are opt-in features, and both sides of the differential are enabled here:
#   "ndarray" — pure-Rust CPU kernels
#   "tch"     — libtorch (PyTorch's C++ library) via the `tch` bindings
# burn-tch enables tch's `download-libtorch` feature, so the libtorch binaries are
# fetched by the build script; no manual install and no LIBTORCH/DYLD_LIBRARY_PATH.
burn = { version = "0.21.0", default-features = false, features = [
    "std",
    "ndarray",
    "tch",
] }

# Engine dependencies.
# `rand` supplies the RNG traits; `rand_chacha` supplies ChaCha8Rng specifically,
# whose output is guaranteed stable across releases — unlike rand's own StdRng,
# which is explicitly allowed to change algorithm. A saved seed has to mean the
# same thing forever, so the guarantee is the point.
rand = "0.10.2"
rand_chacha = "0.10.0"
# Derives the boilerplate (Display, Error) for error enums.
thiserror = "2.0.19"
# Structured logging. The engine only *emits* events; whether anything listens is the
# calling program's business, which is why the library takes the facade and not a
# subscriber. Every event carries the seed, so a log line is always actionable.
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
